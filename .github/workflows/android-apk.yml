name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Make release APK installable without a custom keystore
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          build_gradle = Path('android/app/build.gradle')
          contents = build_gradle.read_text()
          needle = "        release {\n            minifyEnabled false\n"
          replacement = "        release {\n            signingConfig signingConfigs.debug\n            minifyEnabled false\n"

          if needle not in contents:
              raise SystemExit('Expected release block was not found in android/app/build.gradle')

          build_gradle.write_text(contents.replace(needle, replacement, 1))
          PY

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mp3-sorter-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk